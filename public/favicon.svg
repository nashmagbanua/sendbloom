<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sealGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="55%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4c0519" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer scalloped wax seal stamp edge -->
  <circle cx="32" cy="32" r="30" fill="url(#sealGrad)" filter="url(#shadow)"/>
  
  <!-- Inner delicate ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#fecdd3" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.85"/>
  
  <!-- Initials 'SB' -->
  <text x="32" y="39" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="-1"
        text-anchor="middle" 
        fill="#ffffff">
    SB
  </text>
</svg>
